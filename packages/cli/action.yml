# `preprocess deploy` as a GitHub Action, for any CI that runs Actions.
#
#   - uses: actions/checkout@v4
#   - uses: actions/setup-node@v4
#     with: { node-version: 24 }
#   - run: npm ci
#   - uses: preprocess/preprocess/packages/cli@main
#     with:
#       api-url: ${{ vars.PREPROCESS_API_URL }}
#       org: ${{ vars.PREPROCESS_ORG }}
#       api-key: ${{ secrets.PREPROCESS_API_KEY }}
name: Preprocess deploy
description:
  Bundle an agent written with @preprocess/sdk and deploy it to Preprocess.
author: Preprocess, Inc.
inputs:
  api-url:
    description: The Preprocess API origin.
    required: true
  org:
    description: The organization id.
    required: true
  api-key:
    description:
      An organization API key. Pass it from a repository or organization secret.
    required: true
  entry:
    description: The agent's module, relative to working-directory.
    default: src/index.ts
  agent:
    description:
      The agent's name. Defaults to the package.json name without its scope.
    default: ""
  working-directory:
    description: The agent project's directory.
    default: .
runs:
  using: composite
  steps:
    # Node 24 runs the CLI's TypeScript directly. Its only runtime dependency,
    # esbuild, is installed beside a copy of the CLI so the agent project's
    # own node_modules stay untouched.
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: |
        cli="$RUNNER_TEMP/preprocess-cli"
        rm -rf "$cli" && mkdir -p "$cli"
        cp -r "$GITHUB_ACTION_PATH/src" "$cli/src"
        echo '{"type":"module","private":true}' > "$cli/package.json"
        esbuild=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').dependencies.esbuild")
        npm install --prefix "$cli" --no-save --no-package-lock --ignore-scripts --silent "esbuild@$esbuild"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PREPROCESS_API_URL: ${{ inputs.api-url }}
        PREPROCESS_ORG: ${{ inputs.org }}
        PREPROCESS_API_KEY: ${{ inputs.api-key }}
        AGENT: ${{ inputs.agent }}
        ENTRY: ${{ inputs.entry }}
      run:
        node "$RUNNER_TEMP/preprocess-cli/src/main.ts" deploy "$ENTRY"
        ${AGENT:+--agent "$AGENT"}

# Lightweight health-check query used to smoke-test the GraphQL client wiring.
query ClientApiStatus {
  clientApiStatus
}

# Domain Verification widget operations.

fragment OrganizationDomainFields on OrganizationDomain {
  id
  organizationId
  domain
  subdomain
  state
  verificationPrefix
  verificationToken
  nameServer
  createdAt
}

# `organizationDomains` is a paginated connection and defaults to `limit: 10`,
# so callers must page through it to see every domain.
query ListOrganizationDomains(
  $after: String
  $before: String
  $limit: Int
  $order: PaginationOrder
) {
  organizationDomains(
    after: $after
    before: $before
    limit: $limit
    order: $order
  ) {
    data {
      ...OrganizationDomainFields
    }
    listMetadata {
      after
      before
    }
  }
}

mutation CreateOrganizationDomain($domain: String!) {
  createOrganizationDomain(domain: $domain) {
    ...OrganizationDomainFields
  }
}

mutation DeleteOrganizationDomain($id: ID!) {
  deleteOrganizationDomain(id: $id) {
    ...OrganizationDomainFields
  }
}

mutation ReverifyOrganizationDomain($id: ID!) {
  reverifyOrganizationDomain(id: $id) {
    ...OrganizationDomainFields
  }
}

# ---------------------------------------------------------------------------
# Mutation results are unions of a success payload plus typed failure variants.
# We select `__typename` to discriminate and inline-fragment only the variants
# that carry data the UI needs. Failure variants are deliberately NOT unwrapped
# for their `message` field: widgets are localized, so the UI maps `__typename`
# to a translated string rather than rendering server copy. `PasswordPolicy-
# Violation` is the exception — its structured `violations` describe *which*
# rule failed and can't be reconstructed from the typename alone.
# ---------------------------------------------------------------------------

# User Profile / User Security widget operations.

fragment UserFields on User {
  id
  email
  emailVerified
  firstName
  lastName
  profilePictureUrl
  mfaEnabled
  mfaLastUsedAt
  passwordSet
  passwordLastUsedAt
  createdAt
  updatedAt
}

fragment ConnectedAccountFields on ConnectedAccount {
  id
  provider
  email
  firstName
  lastName
  profilePictureUrl
  lastLoginAt
}

fragment PasswordViolationFields on PasswordViolation {
  code
  message
  characterType
  minimumLength
  maximumLength
  allowedSymbols
  breachOccurrences
  strengthWarning
  strengthSuggestions
}

query Me {
  me {
    ...UserFields
    connectedAccounts {
      ...ConnectedAccountFields
    }
  }
}

# Environment-level auth configuration: which methods to offer at all.
query AuthenticationSettings {
  authenticationSettings {
    mfaEnabled
    mfaRequired
    passkeyAuthEnabled
    passwordAuthEnabled
    passwordPolicy {
      minimumLength
      minimumStrength
      rejectsBreachedPasswords
      requiresLowercase
      requiresNumber
      requiresSymbol
      requiresUppercase
    }
  }
}

query Passkeys {
  passkeys {
    id
    createdAt
    updatedAt
    lastVerifiedAt
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    __typename
    ... on ProfileUpdated {
      user {
        ...UserFields
      }
    }
  }
}

mutation SendVerificationCode {
  sendVerificationCode {
    __typename
    ... on VerificationCodeSent {
      authenticationChallengeId
      expiresAt
    }
  }
}

mutation VerifyCurrentEmail($input: VerifyCurrentEmailInput!) {
  verifyCurrentEmail(input: $input) {
    __typename
    ... on CurrentEmailVerified {
      elevatedAccessToken
      expiresAt
    }
  }
}

mutation SendEmailChange($input: SendEmailChangeInput!) {
  sendEmailChange(input: $input) {
    __typename
    ... on EmailChangeSent {
      expiresAt
    }
  }
}

mutation ConfirmEmailChange($input: ConfirmEmailChangeInput!) {
  confirmEmailChange(input: $input) {
    __typename
    ... on EmailChangeConfirmed {
      elevatedAccessToken
      expiresAt
      user {
        ...UserFields
      }
    }
  }
}

mutation CreatePassword($input: CreatePasswordInput!) {
  createPassword(input: $input) {
    __typename
    ... on PasswordCreated {
      success
    }
    ... on PasswordPolicyViolation {
      code
      message
      violations {
        ...PasswordViolationFields
      }
    }
  }
}

mutation UpdatePassword($input: UpdatePasswordInput!) {
  updatePassword(input: $input) {
    __typename
    ... on PasswordUpdated {
      success
    }
    ... on PasswordPolicyViolation {
      code
      message
      violations {
        ...PasswordViolationFields
      }
    }
  }
}

mutation EnrollTotp($input: EnrollTotpInput!) {
  enrollTotp(input: $input) {
    __typename
    ... on TotpFactor {
      authenticationChallengeId
      authenticationFactorId
      secret
      uri
      qrCode
    }
  }
}

mutation VerifyTotp($input: VerifyTotpInput!) {
  verifyTotp(input: $input) {
    __typename
    ... on TotpVerified {
      success
    }
  }
}

mutation RemoveMfaFactor($input: RemoveMfaFactorInput!) {
  removeMfaFactor(input: $input) {
    __typename
    ... on MfaFactorRemoved {
      success
    }
  }
}


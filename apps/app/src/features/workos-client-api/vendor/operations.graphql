# Permissions that can be granted to API keys of the given owner type
# (organization or user), as offered by the API-key permission picker.

query ListApiKeyPermissions(
  $apiKeyOwnerType: ApiKeyOwnerType!
  $after: String
  $before: String
  $limit: Int
  $search: String
) {
  permissions(
    filter: { apiKeyOwnerType: $apiKeyOwnerType, heldByCaller: true }
    after: $after
    before: $before
    limit: $limit
    search: $search
  ) {
    data {
      id
      slug
      name
      description
    }
    listMetadata {
      after
      before
    }
  }
}


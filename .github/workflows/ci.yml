name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # deploy.yml runs these jobs before it deploys a push to main.
  workflow_call:

# Called from deploy.yml, github.workflow is "Deploy", so that run gets its own
# group. Only pull requests cancel superseded runs; main's never are.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The migration check compares the branch with its base.
          # (A string, because a bare 0 is falsy in an expression.)
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate

      # Expand and contract (AGENTS.md): every migration must work with the
      # code already running when it is applied.
      - name: Check migrations
        if: github.event_name == 'pull_request'
        run: pnpm check:migrations "origin/${{ github.base_ref }}"

      - name: Build Workers
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tenant isolation, RLS and audit tests run against a real Postgres. The
    # superuser stands in for the migrator; the tests create the runtime roles.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: preprocess
          POSTGRES_PASSWORD: preprocess
          POSTGRES_DB: preprocess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preprocess" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test in the Workers runtime
        run: pnpm test

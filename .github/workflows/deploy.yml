# Our cloud's deploy pipeline (spec 16c and PRE-46). Every push to main:
#
#   CI -> deploy staging -> Staging smoke test -> production
#
# Production config is private, so the last job only asks preprocess/internal
# to deploy this sha, through the preprocess-deploy GitHub App (Actions: write
# on that repository only). Internal checks the sha is on main and passed the
# "Staging smoke test" check before it deploys anything. Rollback lives there:
#   gh workflow run deploy-preprocess.yml -R preprocess/internal -f rollback=true
#
# Until a stage's secrets exist, its job reports "skipped" with the missing
# names and stays green. v* tags are self-hosted releases and deploy nothing.
#
# Staging calls no real model provider (infra/src/stages.ts callsRealModels):
# it binds no provider key and no Workers AI, and the stub answers every agent
# model, decide and OCR call in its provider's API shape, so the smoke test
# checks our code paths, parsing and metering for nothing. The full real-model
# pass (every agent model, decide and OCR on the providers) runs only when this
# workflow is started by hand on main with real_models; that run redeploys
# staging with the provider keys, runs the pass, and promotes nothing. The next
# push puts staging back on the stub.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      real_models:
        description:
          Deploy staging with the provider keys and run the full real-model pass
          (every agent model, decide and OCR). Costs real money.
        type: boolean
        default: false

# One push at a time, start to finish, so the smoke test always checks the
# commit staging is running. A newer push waits (superseded pending pushes are
# dropped); a running deploy is never cancelled.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy staging
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      CI: "true"
      PREPROCESS_REGION: ${{ vars.PREPROCESS_REGION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
      AUDIT_SIGNING_KEY_ID: ${{ secrets.AUDIT_SIGNING_KEY_ID }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      # Optional: Google sign-in shows only when both are set. The client id is
      # not secret, so it may be stored as either.
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # The product's GitHub App for staging, optional: without it the App's
      # routes answer 503. GitHub reserves the GITHUB_ prefix for its own
      # variables and secrets, so they are stored as GH_* in this environment
      # (written by preprocess/internal's apps/github-setup).
      GITHUB_APP_ID: ${{ vars.GH_APP_ID }}
      GITHUB_APP_SLUG: ${{ vars.GH_APP_SLUG }}
      GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      # Autumn's sandbox (spec 16a): staging bills against it. Optional; without
      # it staging runs with billing off and no plans are pushed.
      AUTUMN_SECRET_KEY: ${{ secrets.AUTUMN_SECRET_KEY }}
      BILLING_REQUIRED_FROM: ${{ vars.BILLING_REQUIRED_FROM }}
      BILLING_INTERNAL_ORGS: ${{ vars.BILLING_INTERNAL_ORGS }}
      BILLING_ENFORCED_ORGS: ${{ vars.BILLING_ENFORCED_ORGS }}
      # Model providers (packages/models endpoints), only for a hand-started
      # real_models run. Otherwise staging gets no keys and the stub serves
      # every model; the stack refuses them anyway without REAL_MODELS.
      REAL_MODELS: ${{ inputs.real_models && 'true' || '' }}
      BASETEN_API_KEY:
        ${{ inputs.real_models && secrets.BASETEN_API_KEY || '' }}
      MISTRAL_API_KEY:
        ${{ inputs.real_models && secrets.MISTRAL_API_KEY || '' }}
      NO_COLOR: "1"
    steps:
      - name: Check credentials
        id: credentials
        run: |
          missing=()
          for name in PREPROCESS_REGION CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            PLANETSCALE_API_TOKEN_ID PLANETSCALE_API_TOKEN PLANETSCALE_ORGANIZATION \
            PLANETSCALE_DATABASE BETTER_AUTH_SECRET AUDIT_SIGNING_KEY \
            AUDIT_SIGNING_KEY_ID EMAIL_FROM; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Staging deploy skipped::Not set for the staging environment: ${missing[*]}. See handoffs/PLAT-32/ci-credentials.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Plans before the code that depends on them (PRE-39).
      - name: Push plans to Autumn's sandbox
        if:
          steps.credentials.outputs.ready == 'true' && env.AUTUMN_SECRET_KEY !=
          ''
        run: pnpm exec atmn push --yes --headless

      - name: Deploy staging
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        run: |
          # An unset optional value must stay unset, not bind an empty string.
          for name in AUTUMN_SECRET_KEY BILLING_REQUIRED_FROM BILLING_INTERNAL_ORGS \
            BILLING_ENFORCED_ORGS REAL_MODELS BASETEN_API_KEY MISTRAL_API_KEY \
            GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_CLIENT_ID GITHUB_APP_PRIVATE_KEY \
            GITHUB_WEBHOOK_SECRET GITHUB_CLIENT_SECRET; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm --filter @preprocess/infra staging:deploy

      # The account's container registry has a fixed 50 GB cap (PRE-90). A
      # warning annotation here from 35 GB and a failed step from 42 GB; it
      # never blocks the deploy.
      - name: Estimate container registry usage
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @preprocess/infra registry usage

      # The stage's URLs contain the account's workers.dev subdomain, which
      # matches a secret's value, so GitHub drops them as a job output. They
      # reach the smoke test as an artifact instead.
      - name: Keep the stage's URLs for the smoke test
        if: steps.deploy.outcome == 'success'
        env:
          OUTPUTS: ${{ steps.deploy.outputs.outputs }}
        run: printenv OUTPUTS > outputs.json
      - if: steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-outputs
          path: outputs.json
          retention-days: 1

  # Its check, "Staging smoke test", is what internal's production deploy
  # requires. It only runs, and so only passes, after a real staging deploy.
  smoke:
    name: Staging smoke test
    needs: staging
    if: needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      # Whether the stage calls real providers, so the smoke test knows to
      # expect the stub's answers (scripts/smoke.ts).
      MODELS: ${{ inputs.real_models && 'real' || 'stub' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: staging-outputs
      - name: Smoke test staging
        env:
          STAGE: staging
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: OUTPUTS="$(cat outputs.json)" pnpm --filter @preprocess/infra smoke

      # One case per agent model on the stub, each with an invoice that is
      # OCR'd and a decide call, so our routing, parsing and metering for
      # every provider's response shape run on each deploy. The job summary
      # shows each case's charge. It does not gate production until it has
      # passed reliably. On a real_models run the stage calls the providers,
      # and the real-model pass below checks them instead.
      - name: Smoke test every model on the stub
        if: ${{ !inputs.real_models }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          STAGE: staging
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run:
          OUTPUTS="$(cat outputs.json)" pnpm --filter @preprocess/infra
          model-check

      # One case runs a command in a small sandbox, and the job summary shows
      # the container's start and stop beside the interval the API billed.
      # It does not gate production until it has passed reliably (PRE-87).
      - name: Smoke test a case sandbox
        continue-on-error: true
        timeout-minutes: 10
        env:
          STAGE: staging
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run:
          OUTPUTS="$(cat outputs.json)" pnpm --filter @preprocess/infra
          smoke:sandbox

      # One case on an agent with a custom sandbox environment (one apt
      # package and one file): the layer builds, goes to R2 and mounts in a
      # real container. The job summary shows its size, build wait and mount
      # time. It does not gate production until it has passed reliably.
      - name: Smoke test a custom environment
        continue-on-error: true
        timeout-minutes: 15
        env:
          STAGE: staging
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run:
          OUTPUTS="$(cat outputs.json)" pnpm --filter @preprocess/infra
          smoke:layer

  # Only on a hand-started run with real_models: every agent model, decide and
  # OCR on the real providers, through the staging the run just deployed with
  # their keys. Any case that does not complete fails this job.
  real-models:
    name: Real-model pass
    needs: smoke
    if: inputs.real_models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: staging-outputs
      - name: Real-model pass
        env:
          STAGE: staging
          MODELS: real
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run:
          OUTPUTS="$(cat outputs.json)" pnpm --filter @preprocess/infra
          model-check

  # Pushes only: a hand-started run tests staging and promotes nothing.
  production:
    name: Promote to production
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      APP_ID: ${{ vars.DEPLOY_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
    steps:
      - name: Check credentials
        id: credentials
        run: |
          missing=()
          [ -n "$APP_ID" ] || missing+=(DEPLOY_APP_ID)
          [ -n "$APP_PRIVATE_KEY" ] || missing+=(DEPLOY_APP_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Production promotion skipped::Not set in the production environment: ${missing[*]}. See handoffs/PLAT-32/ci-credentials.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A one-hour token that can only start workflows in preprocess/internal.
      - name: Mint a token for preprocess/internal
        id: token
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: preprocess
          repositories: internal

      - name: Start internal's production deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run deploy-preprocess.yml -R preprocess/internal --ref main -f sha="$GITHUB_SHA"
          echo "Production deploy of $GITHUB_SHA requested: https://github.com/preprocess/internal/actions/workflows/deploy-preprocess.yml" >> "$GITHUB_STEP_SUMMARY"

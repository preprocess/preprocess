# Per-pull-request previews (spec 16c). Each PR gets its own Alchemy stage,
# pr-<number>, with its own Workers, PlanetScale branch, R2
# bucket, queue and Durable Objects. The URLs are posted on the PR, and the
# stage and its branch are destroyed when the PR closes. See infra/README.md.
# A closed PR whose teardown failed is destroyed again by dispatching this
# workflow with its number.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a closed pull request whose preview to destroy
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  CI: "true"
  PR: ${{ github.event.pull_request.number || inputs.pr }}
  STAGE: pr-${{ github.event.pull_request.number || inputs.pr }}
  DESTROY:
    ${{ github.event_name == 'workflow_dispatch' || github.event.action ==
    'closed' }}
  PREPROCESS_REGION: ${{ vars.PREPROCESS_REGION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
  PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
  PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
  PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
  # The API Worker's required inputs (infra/alchemy.run.ts).
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
  AUDIT_SIGNING_KEY_ID: ${{ secrets.AUDIT_SIGNING_KEY_ID }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests from forks get no secrets, so they get no preview. Until
    # previews are configured (the PREPROCESS_REGION repository variable, set
    # together with the preview secrets), the job is skipped rather than failed.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      vars.PREPROCESS_REGION != ''
    steps:
      # Until every preview secret is set, the job reports skipped steps and
      # stays green instead of failing.
      - name: Check credentials
        id: credentials
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PLANETSCALE_API_TOKEN_ID \
            PLANETSCALE_API_TOKEN PLANETSCALE_ORGANIZATION PLANETSCALE_DATABASE \
            BETTER_AUTH_SECRET AUDIT_SIGNING_KEY AUDIT_SIGNING_KEY_ID EMAIL_FROM; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Preview skipped::Repository secrets not set: ${missing[*]}. See infra/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the pull request is closed
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
          if [ "$state" != closed ]; then
            echo "::error::Pull request #$PR is $state; only a closed pull request's preview is destroyed."
            exit 1
          fi

      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy stage
        id: deploy
        if: steps.credentials.outputs.ready == 'true' && env.DESTROY != 'true'
        run: pnpm --filter @preprocess/infra preview:deploy "$STAGE"

      - name: Smoke test
        if: steps.credentials.outputs.ready == 'true' && env.DESTROY != 'true'
        env:
          OUTPUTS: ${{ steps.deploy.outputs.outputs }}
        run: pnpm --filter @preprocess/infra smoke

      - name: Destroy stage
        id: destroy
        if: steps.credentials.outputs.ready == 'true' && env.DESTROY == 'true'
        run: pnpm --filter @preprocess/infra preview:destroy "$STAGE"

      - name: Comment on the pull request
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          OUTPUTS: ${{ steps.deploy.outputs.outputs }}
          OUTCOME:
            ${{ env.DESTROY == 'true' && format('destroy-{0}',
            steps.destroy.outcome) || steps.deploy.outcome }}
        with:
          script: |
            const marker = "<!-- preview -->";
            const stage = process.env.STAGE;
            const outcome = process.env.OUTCOME;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (outcome === "destroy-success") {
              body = `${marker}\n**Preview \`${stage}\` destroyed**: Workers, R2, queue, Durable Objects, Hyperdrive and PlanetScale branch. [Run](${run})`;
            } else if (outcome.startsWith("destroy-")) {
              body = `${marker}\n**Preview \`${stage}\` failed to tear down.** Resources may remain. [Run](${run})`;
            } else if (outcome === "success") {
              const o = JSON.parse(process.env.OUTPUTS);
              body = [
                marker,
                `**Preview \`${stage}\` is up** at ${context.payload.pull_request.head.sha.slice(0, 7)}`,
                "",
                `- App: ${o.app}`,
                `- API: ${o.api}`,
                `- PlanetScale branch \`${o.branch}\``,
                "",
                `Torn down when this pull request closes. [Run](${run})`,
              ].join("\n");
            } else {
              body = `${marker}\n**Preview \`${stage}\` failed to deploy.** [Run](${run})`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: Number(process.env.PR),
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.PR), body });
            }

# Per-pull-request previews (spec 16c). Each PR gets its own Alchemy stage,
# pr-<number>, with its own Workers, dispatch namespace, PlanetScale branch, R2
# bucket, queue and Durable Objects. The URLs are posted on the PR, and the
# stage and its branch are destroyed when the PR closes. See infra/README.md.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  CI: "true"
  STAGE: pr-${{ github.event.pull_request.number }}
  PREPROCESS_REGION: ${{ vars.PREPROCESS_REGION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
  PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
  PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
  PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests from forks get no secrets, so they get no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy stage
        id: deploy
        if: github.event.action != 'closed'
        run: pnpm --filter @preprocess/infra preview:deploy "$STAGE"

      - name: Smoke test
        if: github.event.action != 'closed'
        env:
          OUTPUTS: ${{ steps.deploy.outputs.outputs }}
        run: node scripts/smoke.ts

      - name: Destroy stage
        id: destroy
        if: github.event.action == 'closed'
        run: pnpm --filter @preprocess/infra preview:destroy "$STAGE"

      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          OUTPUTS: ${{ steps.deploy.outputs.outputs }}
          OUTCOME:
            ${{ github.event.action == 'closed' && format('destroy-{0}',
            steps.destroy.outcome) || steps.deploy.outcome }}
        with:
          script: |
            const marker = "<!-- preview -->";
            const stage = process.env.STAGE;
            const outcome = process.env.OUTCOME;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (outcome === "destroy-success") {
              body = `${marker}\n**Preview \`${stage}\` destroyed**: Workers, dispatch namespace, R2, queue, Durable Objects, Hyperdrive and PlanetScale branch. [Run](${run})`;
            } else if (outcome.startsWith("destroy-")) {
              body = `${marker}\n**Preview \`${stage}\` failed to tear down.** Resources may remain. [Run](${run})`;
            } else if (outcome === "success") {
              const o = JSON.parse(process.env.OUTPUTS);
              body = [
                marker,
                `**Preview \`${stage}\` is up** at ${context.payload.pull_request.head.sha.slice(0, 7)}`,
                "",
                `- App: ${o.app}`,
                `- API: ${o.api}`,
                `- PlanetScale branch \`${o.branch}\`, dispatch namespace \`${o.namespace}\``,
                "",
                `Torn down when this pull request closes. [Run](${run})`,
              ].join("\n");
            } else {
              body = `${marker}\n**Preview \`${stage}\` failed to deploy.** [Run](${run})`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

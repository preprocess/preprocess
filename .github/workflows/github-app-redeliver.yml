# Redelivers the GitHub App's most recent webhook delivery of one event (the
# creation ping by default) and reports the status code our webhook answered.
# The App JWT is minted inside this job from the staging environment's
# GH_APP_ID and GH_APP_PRIVATE_KEY; neither the key nor the JWT is printed.
# Safe to run any time: it only asks GitHub to send a delivery again.
#
# gh workflow run github-app-redeliver.yml -R preprocess/preprocess [-f event=installation]

name: Redeliver GitHub App webhook
run-name: Redeliver GitHub App ${{ inputs.event }} (staging)

on:
  workflow_dispatch:
    inputs:
      event:
        description: Webhook event whose newest delivery to send again
        type: string
        default: ping

permissions:
  contents: read

jobs:
  redeliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      APP_ID: ${{ vars.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      EVENT: ${{ inputs.event }}
    steps:
      - name: Redeliver and report
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "::error::GH_APP_ID or GH_APP_PRIVATE_KEY is not set in the staging environment."
            exit 1
          fi
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          key=$(mktemp)
          chmod 600 "$key"
          printf '%s\n' "$GH_APP_PRIVATE_KEY" > "$key"
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          rm -f "$key"
          jwt="$header.$payload.$signature"
          echo "::add-mask::$jwt"
          api() {
            curl -sS -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          app=$(api https://api.github.com/app)
          echo "App: $(jq -r '"\(.slug) (\(.id))"' <<<"$app")"
          echo "Webhook host: $(api https://api.github.com/app/hook/config | jq -r '.url | sub("^https?://"; "") | split("/")[0]')"

          id=$(api "https://api.github.com/app/hook/deliveries?per_page=100" |
            jq -r --arg e "$EVENT" '[.[] | select(.event == $e and (.redelivery | not))] | first | .id // empty')
          if [ -z "$id" ]; then
            echo "::error::No $EVENT delivery found for this App."
            exit 1
          fi
          before=$(api "https://api.github.com/app/hook/deliveries/$id" | jq -r '.status_code')
          echo "Original $EVENT delivery answered $before"
          code=$(api -o /dev/null -w '%{http_code}' -X POST "https://api.github.com/app/hook/deliveries/$id/attempts")
          echo "Redelivery request answered $code"
          [ "$code" = 202 ] || exit 1

          guid=$(api "https://api.github.com/app/hook/deliveries/$id" | jq -r '.guid')
          for _ in $(seq 1 20); do
            sleep 3
            status=$(api "https://api.github.com/app/hook/deliveries?per_page=100" |
              jq -r --arg g "$guid" '[.[] | select(.guid == $g and .redelivery)] | first | .status_code // empty')
            if [ -n "$status" ] && [ "$status" != 0 ]; then break; fi
          done
          echo "Redelivered $EVENT answered ${status:-nothing}"
          echo "Redelivered $EVENT answered ${status:-nothing}" >> "$GITHUB_STEP_SUMMARY"
          [[ "${status:-}" =~ ^2 ]]
